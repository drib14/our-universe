# Render Infrastructure as Code Blueprint — Frontend Only
# https://render.com/docs/blueprint-spec

services:
  # ── FRONTEND (Static Site) ──
  # Name: pairly-web (URL: https://pairly-web.onrender.com)
  - type: web
    name: pairly-web
    env: static
    buildCommand: cd client && npm install --legacy-peer-deps && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false

